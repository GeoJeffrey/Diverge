[project]
name = "diverge"
version = "0.1.0"
description = "Narrative sentiment analysis pipeline for financial markets."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]