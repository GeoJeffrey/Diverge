<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diverge — Simple Output Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c15; --panel: #111625; --border: #1e2638;
      --text: #e2e8f0; --text2: #94a3b8; --accent: #3b82f6;
      --green: #10b981; --amber: #f59e0b; --red: #ef4444; --gray: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 24px; font-weight: 800; }
    .sub { font-size: 13px; color: var(--text2); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; cursor: pointer; transition: all 0.2s ease; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .ticker { font-size: 20px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    .score { font-size: 36px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .pill-building { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid var(--green); }
    .pill-mixed { background: rgba(100,116,139,0.15); color: var(--gray); border: 1px solid var(--gray); }
    .pill-fading { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid var(--amber); }
    .pill-insufficient_data { background: rgba(148,163,184,0.1); color: var(--text2); border: 1px solid var(--border); }
    .why { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 16px; }
    .trust { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
    .nav-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; }
    .nav-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Diverge — Simple Output Mode</h1>
      <div class="sub">High-level narrative summary cards per ticker</div>
    </div>
    <a href="/dashboard.html" class="nav-btn">← Main Dashboard</a>
  </div>

  <div class="grid" id="cards-grid">
    <div style="grid-column:1/-1;color:var(--text2)">Loading Simple Mode summary cards…</div>
  </div>

  <script>
    async function loadSimpleMode() {
      const res = await fetch('/api/tickers').then(r => r.json());
      const grid = document.getElementById('cards-grid');
      if (!res.tickers || !res.tickers.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;color:var(--text2)">No populated tickers found.</div>';
        return;
      }
      grid.innerHTML = res.tickers.map(t => {
        const scoreStr = t.score !== null ? t.score.toFixed(1) : '—';
        const scoreColor = t.score === null ? 'var(--text2)' : t.score >= 65 ? 'var(--green)' : t.score >= 35 ? 'var(--gray)' : 'var(--amber)';
        const pillClass = `pill-${t.verdict_label}`;
        
        return `
          <div class="card" onclick="window.location.href='/ui_prototype/advanced.html?ticker=${t.ticker}&window_start=${encodeURIComponent(t.window_start_utc)}'">
            <div class="card-top">
              <div>
                <div class="ticker">${t.ticker}</div>
                <div class="trust">⏱ ${t.window_start_utc.slice(0,16).replace('T',' ')}</div>
              </div>
              <div class="score" style="color:${scoreColor}">${scoreStr}</div>
            </div>
            <div style="margin-bottom:12px">
              <span class="pill ${pillClass}">${t.verdict_label}</span>
            </div>
            <div class="why">${t.why_sentence}</div>
            <div class="trust">🔒 ${t.trust_label}</div>
          </div>
        `;
      }).join('');
    }
    loadSimpleMode();
  </script>
</body>
</html>
